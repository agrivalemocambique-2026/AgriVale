<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar Favos de Ovos</title>
<style>
  :root{
    --bg: #FBF8F1;
    --ink: #2B2118;
    --green: #3F5B32;
    --green-dark: #2C4023;
    --yolk: #E3A93E;
    --line: #DED4BE;
    --danger: #A8402E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height:1.4;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  header{
    text-align:center;
    padding:12px 0 20px;
    border-bottom:2px solid var(--green);
    margin-bottom:24px;
  }
  header .egg{
    font-size:34px;
    display:block;
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    margin:0;
    color:var(--green-dark);
    letter-spacing:.3px;
  }
  header p{
    margin:6px 0 0;
    font-size:13px;
    color:#6b5e4a;
    font-family: Arial, sans-serif;
  }
  .stock-card{
    background:white;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    text-align:center;
    margin-bottom:22px;
  }
  .stock-card .num{
    font-size:40px;
    font-weight:bold;
    color:var(--green);
    font-family: Arial, sans-serif;
  }
  .stock-card .label{
    font-size:13px;
    color:#6b5e4a;
    font-family: Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .stock-card .price{
    margin-top:8px;
    font-size:14px;
    font-family: Arial, sans-serif;
    color:var(--ink);
  }
  form{
    background:white;
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  label{
    display:block;
    font-family: Arial, sans-serif;
    font-size:13px;
    font-weight:bold;
    margin:14px 0 6px;
    color:var(--green-dark);
  }
  label:first-of-type{margin-top:0;}
  input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family: Arial, sans-serif;
    background:#FFFDF9;
  }
  input:focus{
    outline:2px solid var(--yolk);
    border-color:var(--yolk);
  }
  .qty-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-row button{
    width:44px;
    height:44px;
    border-radius:8px;
    border:1px solid var(--green);
    background:white;
    color:var(--green-dark);
    font-size:20px;
    cursor:pointer;
  }
  .qty-row input{
    text-align:center;
    flex:1;
  }
  button[type=submit]{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:var(--green);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-family: Arial, sans-serif;
    font-weight:bold;
    cursor:pointer;
  }
  button[type=submit]:disabled{
    background:#a9a294;
    cursor:not-allowed;
  }
  .msg{
    margin-top:14px;
    padding:12px;
    border-radius:8px;
    font-family: Arial, sans-serif;
    font-size:14px;
    display:none;
  }
  .msg.ok{ background:#E9F1E4; color:var(--green-dark); border:1px solid var(--green); display:block; }
  .msg.err{ background:#F6E5E1; color:var(--danger); border:1px solid var(--danger); display:block; }
  .hint{
    font-size:12px;
    color:#8a7c63;
    font-family: Arial, sans-serif;
    margin-top:4px;
  }
  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:#9a8d75;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="egg">🥚</span>
    <h1>Reserva de Favos de Ovos</h1>
    <p>Preencha os seus dados para garantir a sua reserva desta semana</p>
  </header>

  <div class="stock-card">
    <div class="num" id="stockNum">—</div>
    <div class="label">favos disponíveis</div>
    <div class="price" id="stockPrice"></div>
  </div>

  <form id="resForm">
    <div id="msg" class="msg"></div>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" required placeholder="Ex: Maria Chissano">

    <label for="telefone">Telefone / código de cliente</label>
    <input type="text" id="telefone" required placeholder="Ex: 84xxxxxxx">

    <label for="qtd">Quantidade de favos</label>
    <div class="qty-row">
      <button type="button" id="minus">−</button>
      <input type="number" id="qtd" min="1" value="1" required>
      <button type="button" id="plus">+</button>
    </div>
    <p class="hint">1 favo = 30 ovos</p>

    <button type="submit" id="submitBtn">Reservar</button>
  </form>

  <footer>MateMais &middot; Produção própria de ovos</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc,
    runTransaction, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const stockNum = document.getElementById('stockNum');
  const stockPrice = document.getElementById('stockPrice');
  const form = document.getElementById('resForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  const qtdInput = document.getElementById('qtd');

  document.getElementById('plus').onclick = () => qtdInput.value = Number(qtdInput.value) + 1;
  document.getElementById('minus').onclick = () => qtdInput.value = Math.max(1, Number(qtdInput.value) - 1);

  const stockRef = doc(db, "config", "stock");

  async function loadStock() {
    const snap = await getDoc(stockRef);
    if (snap.exists()) {
      const data = snap.data();
      stockNum.textContent = data.favosDisponiveis ?? 0;
      stockPrice.textContent = data.precoPorFavo ? `${data.precoPorFavo} MZN por favo` : '';
      submitBtn.disabled = (data.favosDisponiveis ?? 0) <= 0;
      if ((data.favosDisponiveis ?? 0) <= 0) {
        showMsg('Sem favos disponíveis nesta semana. Volte a tentar em breve.', 'err');
      }
    } else {
      stockNum.textContent = '0';
      showMsg('Ainda não há stock configurado.', 'err');
    }
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const quantidade = Number(qtdInput.value);

    if (!nome || !telefone || quantidade < 1) {
      showMsg('Preencha todos os campos corretamente.', 'err');
      submitBtn.disabled = false;
      return;
    }

    try {
      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(stockRef);
        if (!snap.exists()) throw new Error('Stock não configurado.');
        const disponivel = snap.data().favosDisponiveis ?? 0;
        if (quantidade > disponivel) {
          throw new Error(`Só há ${disponivel} favo(s) disponível(is).`);
        }
        transaction.update(stockRef, { favosDisponiveis: disponivel - quantidade });
      });

      await addDoc(collection(db, "reservas"), {
        nome, telefone, quantidade,
        status: 'pendente',
        criadoEm: serverTimestamp()
      });

      showMsg('Reserva feita com sucesso! Entraremos em contacto para confirmar a entrega.', 'ok');
      form.reset();
      qtdInput.value = 1;
      loadStock();
    } catch (err) {
      showMsg(err.message || 'Erro ao reservar. Tente novamente.', 'err');
      submitBtn.disabled = false;
    }
  });

  loadStock();
</script>
</body>
</html>
