<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#14532d">
<title>AgriVale - Gestor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;color:#1e293b;}
  button,input,select{font-family:inherit;}

  header{
    background:linear-gradient(135deg,#14532d,#166534);
    padding:16px 18px;color:#fff;display:flex;align-items:center;gap:10px;
    box-shadow:0 4px 12px rgba(20,83,45,.2);
  }
  header .logo{width:40px;height:40px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:4px;}
  header .logo img{width:100%;height:100%;object-fit:contain;}
  header h1{font-size:15px;font-weight:800;}
  header p{font-size:10px;opacity:.8;}

  #loginBox{
    max-width:300px;margin:70px auto;background:#fff;border-radius:14px;padding:26px 22px;
    text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.08);
  }
  #loginBox .logo{width:60px;height:60px;background:#f0fdf4;border-radius:12px;display:flex;
    align-items:center;justify-content:center;margin:0 auto 12px;padding:6px;}
  #loginBox .logo img{width:100%;height:100%;object-fit:contain;}
  #loginBox p{color:#64748b;font-size:13px;margin-bottom:6px;}
  #loginBox input{
    width:100%;padding:13px;font-size:20px;text-align:center;letter-spacing:6px;
    border:1.5px solid #e2e8f0;border-radius:9px;margin:12px 0;
  }
  #loginBox button{
    width:100%;padding:12px;background:#166534;color:#fff;border:none;border-radius:9px;
    font-weight:800;cursor:pointer;font-size:14px;
  }
  #loginErr{color:#dc2626;font-size:12px;min-height:16px;margin-top:6px;}

  #app{display:none;max-width:720px;margin:0 auto;padding:16px 14px 50px;}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{
    background:linear-gradient(135deg,#14532d,#15803d);border-radius:12px;padding:14px;color:#fff;
  }
  .stat-card .num{font-size:22px;font-weight:900;}
  .stat-card .lbl{font-size:10px;opacity:.85;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .stat-card.gold{background:linear-gradient(135deg,#b45309,#f59e0b);}

  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:14px;}
  .card h2{font-size:13px;font-weight:800;color:#14532d;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px;}

  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:110px;}
  .field label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;}
  .field input{width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;}

  .btn{background:#166534;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;
    cursor:pointer;font-size:13px;margin-top:12px;}
  .btn.secondary{background:#f0fdf4;border:1.5px solid #16a34a;color:#166534;}
  .btn.danger{background:#fee2e2;color:#dc2626;padding:6px 10px;font-size:12px;margin-top:0;}
  .save-msg{font-size:12px;margin-top:8px;color:#166534;min-height:16px;}

  .zona-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px;}
  .zona-item span{flex:1;}
  .zona-add{display:flex;gap:8px;margin-top:10px;}
  .zona-add input{flex:1;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;}
  .zona-add input.taxa{max-width:90px;}

  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .filters button{
    padding:7px 12px;border-radius:20px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;
    font-size:12px;font-weight:700;cursor:pointer;
  }
  .filters button.active{background:#166534;border-color:#166534;color:#fff;}

  .res-item{border:1px solid #f1f5f9;border-radius:10px;padding:12px;margin-bottom:10px;}
  .res-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;}
  .res-nome{font-weight:800;font-size:14px;color:#14532d;}
  .res-tel{font-size:12px;color:#64748b;}
  .res-qtd{font-size:13px;font-weight:700;color:#166534;background:#f0fdf4;padding:3px 9px;border-radius:20px;}
  .res-detail{font-size:12px;color:#475569;margin:2px 0;}
  .res-detail b{color:#1e293b;}
  .res-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  select.status{font-size:12px;padding:6px 8px;border-radius:7px;border:1.5px solid #e2e8f0;font-weight:700;}
  select.status.pendente{background:#fef3c7;color:#92400e;border-color:#fbbf24;}
  select.status.confirmada{background:#dcfce7;color:#166534;border-color:#16a34a;}
  select.status.entregue{background:#dbeafe;color:#1e40af;border-color:#60a5fa;}
  select.status.cancelada{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
  .origem-tag{font-size:10px;padding:2px 7px;border-radius:20px;background:#f1f5f9;color:#64748b;font-weight:700;}

  .empty{color:#94a3b8;font-size:13px;padding:14px 0;text-align:center;}
</style>
</head>
<body>

<div id="loginBox">
  <div class="logo"><img src="logo.png" alt="AgriVale"></div>
  <p>Painel de Gestão AgriVale</p>
  <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••">
  <button id="loginBtn">Entrar</button>
  <div id="loginErr"></div>
</div>

<div id="app">
  <header style="border-radius:14px;margin-bottom:16px;">
    <div class="logo"><img src="logo.png" alt="AgriVale"></div>
    <div><h1>AgriVale</h1><p>Painel de gestão</p></div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">reservas</div></div>
    <div class="stat-card"><div class="num" id="statFavos">0</div><div class="lbl">favos reservados</div></div>
    <div class="stat-card gold"><div class="num" id="statPendentes">0</div><div class="lbl">pendentes</div></div>
    <div class="stat-card gold"><div class="num" id="statReceita">0</div><div class="lbl">receita estimada (MZN)</div></div>
  </div>

  <div class="card">
    <h2>Stock desta semana</h2>
    <div class="row2">
      <div class="field"><label>Favos disponíveis</label><input type="number" id="favos" min="0"></div>
      <div class="field"><label>Capacidade semanal</label><input type="number" id="capacidade" min="0"></div>
      <div class="field"><label>Preço por favo (MZN)</label><input type="number" id="preco" min="0"></div>
    </div>
    <button class="btn" id="saveStock">Guardar stock</button>
    <div class="save-msg" id="stockMsg"></div>
  </div>

  <div class="card">
    <h2>Zonas de entrega e taxas</h2>
    <div id="zonasList"></div>
    <div class="zona-add">
      <input type="text" id="novaZona" placeholder="Nome do bairro/zona">
      <input type="number" id="novaTaxa" class="taxa" placeholder="MZN">
      <button class="btn secondary" id="addZona" style="margin-top:0;">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Reservas</h2>
    <div class="filters" id="filters">
      <button data-f="todas" class="active">Todas</button>
      <button data-f="pendente">Pendentes</button>
      <button data-f="confirmada">Confirmadas</button>
      <button data-f="entregue">Entregues</button>
      <button data-f="cancelada">Canceladas</button>
    </div>
    <div id="resList"></div>
    <div class="empty" id="emptyMsg" style="display:none;">Ainda não há reservas.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection,
    onSnapshot, updateDoc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const GESTOR_PIN = "1234"; // ALTERE este PIN antes de publicar

  document.getElementById('loginBtn').onclick = () => {
    const pin = document.getElementById('pin').value;
    if (pin === GESTOR_PIN) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    } else {
      document.getElementById('loginErr').textContent = 'PIN incorreto.';
    }
  };

  let todasReservas = [];
  let filtroAtual = 'todas';

  function initApp() {
    const stockRef = doc(db, "config", "stock");
    const entregaRef = doc(db, "config", "entrega");

    // --- Stock ---
    getDoc(stockRef).then(snap => {
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById('favos').value = d.favosDisponiveis ?? 0;
        document.getElementById('capacidade').value = d.capacidadeSemanal ?? 0;
        document.getElementById('preco').value = d.precoPorFavo ?? 0;
      }
    });

    document.getElementById('saveStock').onclick = async () => {
      const favos = Number(document.getElementById('favos').value) || 0;
      const capacidade = Number(document.getElementById('capacidade').value) || 0;
      const preco = Number(document.getElementById('preco').value) || 0;
      await setDoc(stockRef, { favosDisponiveis: favos, capacidadeSemanal: capacidade, precoPorFavo: preco }, { merge: true });
      const m = document.getElementById('stockMsg');
      m.textContent = 'Stock atualizado.';
      setTimeout(() => m.textContent = '', 2000);
    };

    // --- Zonas ---
    async function loadZonas() {
      const snap = await getDoc(entregaRef);
      const zonas = snap.exists() ? (snap.data().zonas || []) : [];
      const list = document.getElementById('zonasList');
      list.innerHTML = zonas.length ? '' : '<p class="empty">Sem zonas configuradas.</p>';
      zonas.forEach((z, i) => {
        const div = document.createElement('div');
        div.className = 'zona-item';
        div.innerHTML = `<span>${escapeHtml(z.nome)} — ${z.taxa} MZN</span><button class="btn danger" data-i="${i}">Remover</button>`;
        list.appendChild(div);
      });
      list.querySelectorAll('button').forEach(btn => {
        btn.onclick = async () => {
          const i = Number(btn.getAttribute('data-i'));
          zonas.splice(i, 1);
          await setDoc(entregaRef, { zonas }, { merge: true });
          loadZonas();
        };
      });
      window._zonasAtuais = zonas;
    }
    loadZonas();

    document.getElementById('addZona').onclick = async () => {
      const nome = document.getElementById('novaZona').value.trim();
      const taxa = Number(document.getElementById('novaTaxa').value) || 0;
      if (!nome) return;
      const zonas = window._zonasAtuais || [];
      zonas.push({ nome, taxa });
      await setDoc(entregaRef, { zonas }, { merge: true });
      document.getElementById('novaZona').value = '';
      document.getElementById('novaTaxa').value = '';
      loadZonas();
    };

    // --- Filtros ---
    document.getElementById('filters').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filtroAtual = e.target.getAttribute('data-f');
      renderReservas();
    });

    // --- Reservas ---
    const q = query(collection(db, "reservas"), orderBy("criadoEm", "desc"));
    onSnapshot(q, (snapshot) => {
      todasReservas = [];
      snapshot.forEach(docSnap => todasReservas.push({ id: docSnap.id, ...docSnap.data() }));
      renderReservas();
    });

    function renderReservas() {
      const list = document.getElementById('resList');
      const filtradas = filtroAtual === 'todas' ? todasReservas : todasReservas.filter(r => r.status === filtroAtual);

      document.getElementById('emptyMsg').style.display = filtradas.length ? 'none' : 'block';
      list.innerHTML = '';

      let totalFavos = 0, pendentes = 0, receita = 0;
      todasReservas.forEach(r => {
        totalFavos += r.quantidade || 0;
        if (r.status === 'pendente') pendentes++;
        if (r.status !== 'cancelada') receita += r.totalEstimado || 0;
      });
      document.getElementById('statTotal').textContent = todasReservas.length;
      document.getElementById('statFavos').textContent = totalFavos;
      document.getElementById('statPendentes').textContent = pendentes;
      document.getElementById('statReceita').textContent = receita;

      filtradas.forEach(r => {
        const div = document.createElement('div');
        div.className = 'res-item';
        const entregaTxt = r.tipoEntrega === 'domicilio'
          ? `🚚 Entrega — ${escapeHtml(r.endereco||'')} (${escapeHtml(r.zona||'')})`
          : `🏠 Levantamento no local`;
        div.innerHTML = `
          <div class="res-top">
            <div>
              <div class="res-nome">${escapeHtml(r.nome||'')} <span class="origem-tag">${r.origem==='operador'?'Operador':'Online'}</span></div>
              <div class="res-tel">${escapeHtml(r.telefone||'')}</div>
            </div>
            <div class="res-qtd">${r.quantidade||0} favo(s)</div>
          </div>
          <div class="res-detail">${entregaTxt}</div>
          <div class="res-detail"><b>Data:</b> ${r.dataDesejada||'—'} &nbsp; <b>Hora:</b> ${r.horaDesejada||'—'}</div>
          <div class="res-detail"><b>Total estimado:</b> ${r.totalEstimado||0} MZN</div>
          <div class="res-bottom">
            <select class="status ${r.status}" data-id="${r.id}">
              <option value="pendente" ${r.status==='pendente'?'selected':''}>Pendente</option>
              <option value="confirmada" ${r.status==='confirmada'?'selected':''}>Confirmada</option>
              <option value="entregue" ${r.status==='entregue'?'selected':''}>Entregue</option>
              <option value="cancelada" ${r.status==='cancelada'?'selected':''}>Cancelada</option>
            </select>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll('select.status').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const id = e.target.getAttribute('data-id');
          await updateDoc(doc(db, "reservas", id), { status: e.target.value });
          e.target.className = 'status ' + e.target.value;
        });
      });
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
